# Full-stack demo without a GPU: all five services run, with the two
# LLM services in MOCK_MODELS mode (canned responses, no model download).
#
#   docker compose -f docker-compose.mock.yml up --build
#
# Frontend: http://localhost:7860 · Gateway API: http://localhost:8000

services:
  inference-service:
    build:
      context: ./services/inference-service
      args:
        REQUIREMENTS: requirements-ci.txt
    ports:
      - "8001:8001"
    environment:
      MOCK_MODELS: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  sentiment-service:
    build:
      context: ./services/sentiment-service
    ports:
      - "8002:8002"
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  response-service:
    build:
      context: ./services/response-service
      args:
        REQUIREMENTS: requirements-ci.txt
    ports:
      - "8003:8003"
    environment:
      MOCK_MODELS: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      INFERENCE_SERVICE_URL: http://inference-service:8001
      SENTIMENT_SERVICE_URL: http://sentiment-service:8002
      RESPONSE_SERVICE_URL: http://response-service:8003
      LOG_LEVEL: INFO
    depends_on:
      inference-service:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
      response-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "7860:7860"
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
