apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: response-hpa
  namespace: elyssa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: response-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 90
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
