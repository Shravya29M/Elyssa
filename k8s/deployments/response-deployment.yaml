apiVersion: apps/v1
kind: Deployment
metadata:
  name: response-service
  namespace: elyssa
  labels:
    app: response-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: response-service
  template:
    metadata:
      labels:
        app: response-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: response-service
          image: ghcr.io/shravya29m/elyssa-response:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: response-config
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "12Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        accelerator: nvidia-gpu
