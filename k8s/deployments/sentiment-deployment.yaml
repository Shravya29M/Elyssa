apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: elyssa
  labels:
    app: sentiment-service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment-service
  template:
    metadata:
      labels:
        app: sentiment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sentiment-service
          image: ghcr.io/your-org/elyssa-sentiment:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: sentiment-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
