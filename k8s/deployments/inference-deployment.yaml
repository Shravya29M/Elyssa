apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: elyssa
  labels:
    app: inference-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inference-service
          image: ghcr.io/your-org/elyssa-inference:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: inference-config
          resources:
            requests:
              cpu: "2"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "20Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 150
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        accelerator: nvidia-gpu
