version: "3.9"

services:
  inference-service:
    build:
      context: ./services/inference-service
    ports:
      - "8001:8001"
    environment:
      MODEL_ID: seasalt29/imageModelBig
      LOAD_IN_4BIT: "true"
      MAX_NEW_TOKENS: "128"
      INFERENCE_TEMPERATURE: "0.1"
      LOG_LEVEL: INFO
      HF_HOME: /model-cache
    volumes:
      - model-cache:/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  sentiment-service:
    build:
      context: ./services/sentiment-service
    ports:
      - "8002:8002"
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  response-service:
    build:
      context: ./services/response-service
    ports:
      - "8003:8003"
    environment:
      MODEL_ID: seasalt29/model3
      MAX_SEQ_LENGTH: "512"
      MAX_NEW_TOKENS: "512"
      LOG_LEVEL: INFO
      HF_HOME: /model-cache
    volumes:
      - model-cache:/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gateway:
    build:
      context: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      INFERENCE_SERVICE_URL: http://inference-service:8001
      SENTIMENT_SERVICE_URL: http://sentiment-service:8002
      RESPONSE_SERVICE_URL: http://response-service:8003
      LOG_LEVEL: INFO
    depends_on:
      inference-service:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
      response-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "7860:7860"
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  model-cache:
    driver: local
